name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: dandelion-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # Keeps .../releases/download/latest/app-debug.apk pointing at the newest build on main.
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dandelion-debug
          path: apk
      - name: Replace the latest prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view latest >/dev/null 2>&1 ||
            gh release create latest \
              --title "Latest debug build" \
              --notes "The debug build from the newest commit on main." \
              --prerelease
          gh release upload latest apk/app-debug.apk --clobber
